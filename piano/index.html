<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ブラウザピアノ｜無料・キーボードとタップで弾ける鍵盤（和音・ドレミ表示）</title>
  <meta name="description" content="ブラウザで弾ける無料のピアノ。スマホは横向きで 2 オクターブ、複数の指で和音も鳴ります。パソコンはキーボードで演奏（JIS・US 配列どちらも同じ位置）。ドレミ／CDE の音名、サステイン、クリック、音色 6 種、MIDI キーボードにも対応。音はその場で合成するので読み込み待ちなし・登録不要。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://yorozu-craft.com/web-metronome/piano/">

  <meta property="og:title" content="ブラウザピアノ｜キーボードとタップで弾ける無料の鍵盤">
  <meta property="og:description" content="スマホは横向きで 2 オクターブ・和音も。パソコンはキーボードで。ドレミ／CDE 表示、サステイン、クリックつき。登録不要。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yorozu-craft.com/web-metronome/piano/">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:image" content="https://yorozu-craft.com/web-metronome/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="yorozu-craft">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="theme-color" content="#1f1d1a">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "ブラウザピアノ",
    "url": "https://yorozu-craft.com/web-metronome/piano/",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "All",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
    "inLanguage": "ja",
    "browserRequirements": "Requires JavaScript"
  }
  </script>

  <!-- 全画面で弾く画面なので AdSense は meta だけ（自動広告が鍵盤を隠さないように。広告は使い方ページで出す） -->
  <meta name="google-adsense-account" content="ca-pub-5375267956079717">

  <link rel="stylesheet" href="./piano.css">
</head>
<body class="piano-page">
  <main class="piano-app">
    <header class="bar" id="bar">
      <h1 class="bar-title">ブラウザピアノ</h1>
      <!-- メトロノームとピアノは同列（オーナー指摘 2026-09-27）。両方の画面の上端に同じ切り替えを置く -->
      <nav class="mode-switch" aria-label="メトロノームとピアノの切り替え"><a href="../" title="メトロノームへ"><svg class="ms-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M8.5 2.5h7l5 19h-17z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 18 16.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="ms-text">メトロノーム</span></a><a href="./" aria-current="page" title="ピアノ（今の画面）"><svg class="ms-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><rect x="2.5" y="4.5" width="19" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4.5v15M15 4.5v15" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 5h3v7h-3zM13.5 5h3v7h-3z" fill="currentColor"/></svg><span class="ms-text">ピアノ</span></a></nav>
      <div class="group" role="group" aria-label="音の高さ">
        <button type="button" class="ctl step" id="octDown" aria-label="白鍵 1 つ低く（長押しで 1 オクターブ）" title="白鍵 1 つ低く（長押し・Shift＋←で 1 オクターブ）">◀</button>
        <span class="range" id="rangeLabel" aria-live="polite">C3〜C5</span>
        <button type="button" class="ctl step" id="octUp" aria-label="白鍵 1 つ高く（長押しで 1 オクターブ）" title="白鍵 1 つ高く（長押し・Shift＋→で 1 オクターブ）">▶</button>
      </div>
      <div class="group seg" role="radiogroup" aria-label="音名の表示">
        <label><input type="radio" name="names" value="doremi" checked><span>ドレミ</span></label>
        <label><input type="radio" name="names" value="cde"><span>CDE</span></label>
        <label><input type="radio" name="names" value="none"><span>なし</span></label>
      </div>
      <button type="button" class="ctl toggle" id="sustainBtn" aria-pressed="false" title="Space を押している間もサステイン">サステイン</button>
      <label class="group vol"><span class="vol-label">音量</span><input type="range" id="volume" min="0" max="100" value="70" aria-label="音量"></label>
      <div class="group click" role="group" aria-label="クリック（メトロノーム）">
        <button type="button" class="ctl toggle" id="clickBtn" aria-pressed="false" title="クリック（メトロノーム）を鳴らす">♩ クリック</button>
        <input type="number" id="bpm" min="30" max="240" value="90" inputmode="numeric" aria-label="クリックの BPM">
      </div>
      <details class="more" id="more">
        <summary class="ctl" id="moreSum" title="音色・MIDI・保存・運営者情報など"><span class="more-label">音色: </span><span id="timbreName">ピアノ</span><span id="midiMark"></span></summary>
        <div class="more-panel" id="morePanel">
          <fieldset class="timbres">
            <legend>音色</legend>
            <div class="timbre-list" id="timbreList"></div>
          </fieldset>
          <div class="midi">
            <p class="midi-title">MIDI キーボード</p>
            <button type="button" class="ctl" id="midiBtn">MIDI キーボードをつなぐ</button>
            <p class="midi-status" id="midiStatus" aria-live="polite">USB などでつないだ MIDI キーボードで弾けます。</p>
          </div>
          <div class="midi">
            <p class="midi-title">保存</p>
            <button type="button" class="ctl" data-reset-storage="web-metronome_piano">保存した内容をすべて消す（初期状態に戻す）</button>
          </div>
          <!-- 共通ページへのリンクはここ（鍵盤の下に置くと、横向きのスマホで弾いた指が当たって誤タップが続いたため。2026-09-27） -->
          <nav class="midi site-links" aria-label="このサイト">
            <p class="midi-title">このサイト</p>
            <ul>
              <li><a href="./guide.html">ピアノの使い方</a></li>
              <li><a href="../../">yorozu-craft トップ</a></li>
              <li><a href="../../about.html">運営者情報</a></li>
              <li><a href="../../privacy-policy.html">プライバシーポリシー</a></li>
            </ul>
            <p class="midi-status">入力も演奏も外部に送信しません。</p>
          </nav>
        </div>
      </details>
      <button type="button" class="ctl" id="shareBtn" title="いま弾いたフレーズ（最後の 32 音まで）を共有">共有</button>
      <a class="ctl help" href="./guide.html">使い方</a>
    </header>

    <div class="stage" id="stage" aria-label="鍵盤。タップかパソコンのキーで弾きます">
      <div class="keys" id="keys"></div>
    </div>
    <!-- 共有される結果（K124）: いま弾いたフレーズのカード。共有のリンクで開いたときは、送った人のフレーズ -->
    <div class="share-dialog" id="shareDialog" role="dialog" aria-modal="true" aria-labelledby="shareTitle" hidden>
      <div class="share-inner">
        <p class="share-title" id="shareTitle">フレーズを共有</p>
        <p class="share-empty" id="shareEmpty" hidden>鍵盤を弾くと、最後に弾いた 32 音までを共有できます。</p>
        <div id="share-host"></div>
        <div class="share-row">
          <button type="button" class="ctl" id="sharePlay">▶ 聞く</button>
          <button type="button" class="ctl" id="shareClose">閉じて弾く</button>
        </div>
      </div>
    </div>
    <p class="rotate-hint" id="rotateHint">横向きにすると 2 オクターブ出ます</p>

    <!-- 鍵盤の下にはリンクを置かない（フッターは「音色」のメニューと使い方ページへ移した）。画面はちょうど 1 画面で、下にスクロールしない -->
  </main>

  <script src="./piano-core.js"></script>
  <script src="./synth.js"></script>
  <script src="../reset-storage.js"></script>
  <script src="../share-card.js"></script>
  <script src="./piano.js"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b79bf821e1fd4b6683866d493b1de426"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
