<body class="piano-page">
  <main class="piano-app">
    <header class="bar" id="bar">
      <h1 class="bar-title">ブラウザピアノ</h1>
      <div class="group" role="group" aria-label="音の高さ">
        <button type="button" class="ctl step" id="octDown" aria-label="白鍵 1 つ低く（長押しで 1 オクターブ）" title="白鍵 1 つ低く（長押し・Shift＋←で 1 オクターブ）">◀</button>
        <span class="range" id="rangeLabel" aria-live="polite">C3〜C5</span>
        <button type="button" class="ctl step" id="octUp" aria-label="白鍵 1 つ高く（長押しで 1 オクターブ）" title="白鍵 1 つ高く（長押し・Shift＋→で 1 オクターブ）">▶</button>
      </div>
      <div class="group seg" role="radiogroup" aria-label="音名の表示">
        <label><input type="radio" name="names" value="doremi" checked><span>ドレミ</span></label>
        <label><input type="radio" name="names" value="cde"><span>CDE</span></label>
        <label><input type="radio" name="names" value="none"><span>なし</span></label>
      </div>
      <button type="button" class="ctl toggle" id="sustainBtn" aria-pressed="false" title="Space を押している間もサステイン">サステイン</button>
      <label class="group vol"><span class="vol-label">音量</span><input type="range" id="volume" min="0" max="100" value="70" aria-label="音量"></label>
      <div class="group click" role="group" aria-label="クリック（メトロノーム）">
        <button type="button" class="ctl toggle" id="clickBtn" aria-pressed="false" title="クリック（メトロノーム）を鳴らす">♩ クリック</button>
        <input type="number" id="bpm" min="30" max="240" value="90" inputmode="numeric" aria-label="クリックの BPM">
      </div>
      <details class="more" id="more">
        <summary class="ctl" id="moreSum"><span class="more-label">音色: </span><span id="timbreName">ピアノ</span><span id="midiMark"></span></summary>
        <div class="more-panel" id="morePanel">
          <fieldset class="timbres">
            <legend>音色</legend>
            <div class="timbre-list" id="timbreList"></div>
          </fieldset>
          <div class="midi">
            <p class="midi-title">MIDI キーボード</p>
            <button type="button" class="ctl" id="midiBtn">MIDI キーボードをつなぐ</button>
            <p class="midi-status" id="midiStatus" aria-live="polite">USB などでつないだ MIDI キーボードで弾けます。</p>
          </div>
        </div>
      </details>
      <a class="ctl help" href="./guide.html">使い方</a>
    </header>

    <div class="stage" id="stage" aria-label="鍵盤。タップかパソコンのキーで弾きます">
      <div class="keys" id="keys"></div>
    </div>
    <p class="rotate-hint" id="rotateHint">横向きにすると 2 オクターブ出ます</p>

    <footer class="mini-foot">
      <a href="../">メトロノーム</a>
      <a href="./guide.html">使い方</a>
      <a href="../../">yorozu-craft トップ</a>
      <a href="../../about.html">運営者情報</a>
      <a href="../../privacy-policy.html">プライバシーポリシー</a>
      <span>入力も演奏も外部に送信しません</span>
    </footer>
  </main>

  <script src="./piano-core.js"></script>
  <script src="./synth.js"></script>
  <script src="./piano.js"></script>

</html>
